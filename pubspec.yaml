name: roktosheba
description: "Roktosheba - Blood donor finder and emergency request app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^22.3.3
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geoflutterfire_plus: ^0.0.34
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  package_info_plus: ^10.2.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#D40F14"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFF9F4"
    theme_color: "#D40F14"

flutter:
  uses-material-design: true